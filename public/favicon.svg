<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="40%" stop-color="#FFC21A"/>
      <stop offset="100%" stop-color="#E5A600"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FFC21A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="#06264A"/>

  <!-- Golden Emblem Group -->
  <g transform="translate(0, -10)" filter="url(#goldGlow)">
    <!-- Central Petal -->
    <path d="M 256 95 C 278 145 280 230 256 270 C 232 230 234 145 256 95 Z" fill="url(#goldPetal)"/>
    
    <!-- Left Inner Petal -->
    <path d="M 256 270 C 230 215 195 160 175 135 C 172 170 205 235 256 270 Z" fill="url(#goldPetal)"/>
    
    <!-- Right Inner Petal -->
    <path d="M 256 270 C 282 215 317 160 337 135 C 340 170 307 235 256 270 Z" fill="url(#goldPetal)"/>

    <!-- Left Outer Petal -->
    <path d="M 256 270 C 205 240 145 205 110 195 C 122 235 175 275 256 270 Z" fill="url(#goldPetal)"/>

    <!-- Right Outer Petal -->
    <path d="M 256 270 C 307 240 367 205 402 195 C 390 235 337 275 256 270 Z" fill="url(#goldPetal)"/>

    <!-- Base bud circle -->
    <circle cx="256" cy="274" r="13" fill="url(#goldPetal)"/>
  </g>

  <!-- Typography BKO COSMO DISTRIBUTION -->
  <text x="256" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="3">BKO</text>
  <text x="256" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="20" fill="#FFC21A" letter-spacing="2.5">COSMO DISTRIBUTION</text>
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="500" font-size="13" fill="#94a3b8" letter-spacing="1">GROSSISTE PHARMACIES &amp; SUPERMARCHÉS</text>
</svg>